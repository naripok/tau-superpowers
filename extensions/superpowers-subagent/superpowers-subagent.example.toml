# Tau Superpowers subagent dispatch configuration: example.
#
# The `task` tool reads this file from two of the directories Tau reads its
# other durable configs from:
#
#   1. user:     ~/.tau/superpowers-subagent.toml
#   2. project:  <project>/.tau/superpowers-subagent.toml
#                (the nearest ancestor .tau from the session working directory)
#
# A project file shadows the user file per key. Copy this file into your
# dotfiles and link it as ~/.tau/superpowers-subagent.toml to set durable
# overrides: edit values here instead of at call sites, and extension updates
# cannot silently change your subagent behavior.
#
# Effective provider/model/reasoning_effort resolve per field, highest first:
#
#   1. `[agents.<name>]` in this file
#   2. the selected agent definition's frontmatter
#   3. `[defaults]` in this file
#   4. the parent session's active provider, model, and thinking level
#
# With this file absent or empty, every subagent that pins nothing inherits
# the parent session's model and thinking effort by default.

# Global fallback for agents that pin nothing and select no call override;
# values not set here still fall through to the parent session.
[defaults]
# provider = "openai"
# model = "gpt-5.6-sol"
# reasoning_effort = "medium"   # off | minimal | low | medium | high | xhigh

# Per-agent overrides. Uncomment an agent section and its values to pin
# provider, model, or reasoning_effort for that one agent.
[agents.implementation]
# provider = "openrouter"
# model = "deepseek/deepseek-v4-flash-0731"
# reasoning_effort = "xhigh"

[agents.code-review]
# provider = "openrouter"
# model = "z-ai/glm-5.3"
# reasoning_effort = "medium"

[agents.document-review]
# provider = "openrouter"
# model = "z-ai/glm-5.3"
# reasoning_effort = "medium"
